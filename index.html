<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AM Receipts">
<meta name="theme-color" content="#1a6b2f">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Al Madni-Barkati | Receipts</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root { --green:#1a6b2f; --dgreen:#0f4a1f; --yellow:#f5c518; --red:#c0392b; --bg:#e8f5e9; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Amiri',serif;background:var(--bg);min-height:100vh;padding:env(safe-area-inset-top,10px) 10px env(safe-area-inset-bottom,10px);}

/* PASSWORD */
#lockScreen{position:fixed;inset:0;background:var(--green);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;}
.lock-logo{font-size:52px;margin-bottom:10px;}
.lock-title{font-family:'Amiri',serif;font-size:20px;font-weight:700;color:var(--yellow);text-align:center;margin-bottom:4px;}
.lock-sub{font-size:12px;color:#c8e6c9;text-align:center;margin-bottom:30px;}
.lock-card{background:#fff;border-radius:16px;padding:24px 20px;width:100%;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.3);text-align:center;}
.lock-card label{display:block;font-size:13px;font-weight:700;color:var(--dgreen);margin-bottom:10px;}
.lock-input{width:100%;padding:13px 16px;border:2px solid #a5d6a7;border-radius:10px;font-size:18px;font-family:inherit;text-align:center;letter-spacing:4px;outline:none;margin-bottom:14px;color:#222;-webkit-appearance:none;}
.lock-input:focus{border-color:var(--green);}
.lock-input.error{border-color:var(--red);animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lock-btn{width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:16px;font-family:inherit;font-weight:700;cursor:pointer;}
.lock-error{color:var(--red);font-size:12px;margin-top:10px;font-weight:700;min-height:18px;}

/* INSTALL */
#installBanner{display:none;background:var(--dgreen);color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:10px;font-size:13px;text-align:center;line-height:1.6;}
#installBanner b{color:var(--yellow);}

/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:12px;position:sticky;top:0;z-index:100;background:var(--bg);padding:8px 0 4px;}
.tab-btn{flex:1;padding:11px 4px;border:none;border-radius:10px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;background:#c8e6c9;color:var(--dgreen);transition:all .2s;}
.tab-btn.active{background:var(--green);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.2);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* FORM */
.form-card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);max-width:520px;margin:0 auto;}
.form-card h2{text-align:center;color:var(--green);font-size:17px;margin-bottom:14px;border-bottom:2px solid var(--yellow);padding-bottom:8px;}
.form-row{margin-bottom:12px;}
.form-row label{display:block;font-size:12px;font-weight:700;color:var(--dgreen);margin-bottom:4px;}
.form-row input,.form-row textarea{width:100%;padding:11px 12px;border:1.5px solid #a5d6a7;border-radius:8px;font-size:15px;font-family:inherit;color:#222;background:#f9fffe;outline:none;-webkit-appearance:none;}
.form-row input:focus,.form-row textarea:focus{border-color:var(--green);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dtype-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.dtype-option{display:none;}
.dtype-label{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 4px;border:2px solid #a5d6a7;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;color:var(--green);background:#f1f8f1;text-align:center;line-height:1.3;}
.dtype-option:checked+.dtype-label{background:var(--red);border-color:var(--red);color:#fff;}
.dtype-label .guj{font-size:9px;margin-top:2px;color:var(--green);}
.dtype-option:checked+.dtype-label .guj{color:#ffd;}
.stamp-upload-area{border:2px dashed #a5d6a7;border-radius:10px;padding:14px;text-align:center;cursor:pointer;background:#f9fffe;}
.stamp-preview{max-width:120px;max-height:80px;margin:8px auto 0;display:block;border-radius:6px;}
.stamp-clear{margin-top:6px;background:var(--red);color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:12px;font-family:inherit;cursor:pointer;}
.btn-generate{width:100%;padding:15px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:16px;font-family:inherit;font-weight:700;cursor:pointer;margin-top:6px;}

/* RECEIPT ACTIONS */
#receiptArea{max-width:560px;margin:0 auto;}
.receipt-actions{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;}
.receipt-actions button{flex:1;min-width:70px;padding:11px 6px;border:none;border-radius:8px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;}
.btn-print{background:var(--green);color:#fff;}
.btn-wa{background:#25D366;color:#fff;}
.btn-new{background:var(--yellow);color:#222;}
.btn-back{background:#eee;color:#333;}

/* ══ RECEIPT CARD — matches hardcopy exactly ══ */
.receipt-body{background:#fffef0;border:3px solid var(--green);border-radius:8px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.15);width:100%;}

/* Yellow header */
.r-header{background:var(--yellow);padding:8px 10px 6px;border-bottom:4px solid var(--green);}
.r-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.r-logo{width:48px;height:48px;object-fit:contain;}
.r-header-center{flex:1;text-align:center;padding:0 6px;}
.r-arabic-top{font-family:'Amiri',serif;font-size:11px;color:#8B0000;direction:rtl;margin-bottom:2px;line-height:1.4;}
.r-org{font-size:16px;font-weight:900;color:var(--red);text-transform:uppercase;letter-spacing:.3px;line-height:1.2;}
.r-sub{font-size:10px;color:var(--dgreen);font-weight:700;margin:2px 0;}
.r-addr{font-size:8.5px;color:#333;margin-top:1px;}

/* Green Gujarati band */
.r-guj-band{background:var(--green);color:#fff;font-size:8.5px;text-align:center;padding:5px 8px;line-height:1.6;border-bottom:2px solid var(--yellow);}

/* Fields area */
.r-fields{padding:8px 10px;}

/* Top row: No. | Trust Reg | Date */
.r-row-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ccc;padding-bottom:5px;margin-bottom:6px;flex-wrap:wrap;gap:3px;}
.r-no{font-size:13px;font-weight:700;}
.r-no span{color:var(--red);font-size:16px;font-weight:900;}
.r-treg{font-size:10px;color:#333;font-weight:600;}
.r-date-block{font-size:11px;font-weight:700;}

/* Field lines */
.r-fl{display:flex;align-items:flex-end;margin-bottom:6px;gap:4px;}
.r-lbl{font-size:11px;font-weight:700;white-space:nowrap;min-width:90px;color:#111;}
.r-val{flex:1;border-bottom:1.5px solid #222;font-size:12px;padding-bottom:1px;min-height:16px;color:#111;}

/* Account type boxes */
.r-actype-row{display:flex;align-items:center;gap:6px;margin:5px 0;}
.r-actype-lbl{font-size:11px;font-weight:700;white-space:nowrap;color:#111;}
.dtype-boxes{display:flex;gap:3px;flex:1;}
.dtype-box{flex:1;border:1.5px solid #777;border-radius:3px;overflow:hidden;text-align:center;}
.dtype-box .top{background:var(--red);color:#fff;font-size:8px;font-weight:700;padding:2px 1px;text-transform:uppercase;}
.dtype-box .bot{background:var(--green);color:#fff;font-size:7px;padding:2px 1px;min-height:13px;display:flex;align-items:center;justify-content:center;}
.dtype-box.sel{border-color:var(--dgreen);border-width:2px;}
.dtype-box.sel .top{background:var(--dgreen);}
.dtype-box.sel .bot{background:#155724;}

/* PAN line */
.r-pan-line{display:flex;align-items:center;gap:8px;margin:5px 0;flex-wrap:wrap;}
.r-pan-badge{background:#d32f2f;color:#fff;font-size:9px;font-weight:700;padding:3px 8px;border-radius:3px;}
.r-80g{font-size:9px;color:#333;}

/* Amount in words */
.r-words-row{display:flex;align-items:flex-end;gap:4px;margin:8px 0 4px;}
.r-words-lbl{font-size:11px;font-weight:700;white-space:nowrap;color:#111;}
.r-words-val{flex:1;border-bottom:1.5px solid #222;font-size:11px;font-style:italic;padding-bottom:1px;min-height:16px;color:#111;}

/* Footer — Trustee | Bank+Amount | Receiver */
.r-footer{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;padding-top:6px;border-top:1px solid #bbb;gap:4px;}
.r-sign-block{text-align:center;font-size:10px;font-weight:700;color:#111;flex:1;position:relative;}
.r-sign-line{border-bottom:1.5px solid #222;margin:44px auto 4px;width:90px;}
.r-stamp-over{position:absolute;top:0;left:50%;transform:translateX(-50%);}
.r-stamp-over img{max-width:80px;max-height:52px;object-fit:contain;opacity:.9;}
.r-center-col{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;}
.r-bank{font-size:9px;color:var(--dgreen);font-weight:700;line-height:1.4;}
.r-amt-box{border:2px solid #333;border-radius:3px;padding:5px 12px;font-size:14px;font-weight:700;background:#fff;display:inline-flex;align-items:center;}
.r-rupee{color:var(--red);margin-right:3px;font-size:15px;}

/* RECORDS */
#recordsArea{max-width:700px;margin:0 auto;}
.records-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.records-hdr h2{color:var(--green);font-size:15px;}
.btn-export{padding:9px 14px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-clr{padding:9px 14px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.table-wrap{overflow-x:auto;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.1);}
table{width:100%;border-collapse:collapse;background:#fff;font-size:11px;}
thead tr{background:var(--green);color:#fff;}
th{padding:9px 7px;text-align:left;white-space:nowrap;}
td{padding:8px 7px;border-bottom:1px solid #e0f2e0;white-space:nowrap;}
tr:nth-child(even) td{background:#f1f8f1;}
.badge{display:inline-block;background:var(--red);color:#fff;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;}
.no-rec{text-align:center;padding:28px;color:#999;font-size:13px;}
.total-bar{background:var(--yellow);padding:10px 14px;border-radius:8px;margin-top:10px;font-weight:700;font-size:14px;color:#222;display:flex;justify-content:space-between;}

/* TOAST */
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:9998;display:none;white-space:nowrap;}

/* PRINT */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  html,body{margin:0!important;padding:0!important;background:#fff!important;}
  #lockScreen,.tabs,.receipt-actions,#formTab,#recordsTab,#installBanner,#toast{display:none!important;}
  #receiptTab{display:block!important;padding:0!important;margin:0!important;}
  #receiptArea{max-width:100%!important;margin:0!important;padding:0!important;}
  .receipt-body{box-shadow:none!important;border-radius:0!important;border:2px solid #1a6b2f!important;margin:0!important;width:100%!important;}
  @page{margin:6mm;size:A5 landscape;}
}
</style>
</head>
<body>

<!-- PASSWORD -->
<div id="lockScreen">
  <div class="lock-logo">🕌</div>
  <div class="lock-title">Al Madni-Barkati</div>
  <div class="lock-sub">Social-Welfare Trust · Receipt System</div>
  <div class="lock-card">
    <label>🔒 Enter Password to Continue</label>
    <input class="lock-input" type="password" id="lockPass" placeholder="••••••" maxlength="20" onkeydown="if(event.key==='Enter')checkPass()"/>
    <button class="lock-btn" onclick="checkPass()">Open App ➜</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<div id="installBanner">📱 <b>Add to Home Screen:</b> Tap Share (↑) in Safari → <b>"Add to Home Screen"</b></div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" onclick="showTab('formTab',this)">📋 New Receipt</button>
  <button class="tab-btn" id="receiptTabBtn" style="display:none" onclick="showTab('receiptTab',this)">🧾 Receipt</button>
  <button class="tab-btn" onclick="showTab('recordsTab',this)">📊 Records</button>
</div>

<!-- FORM -->
<div id="formTab" class="tab-panel active">
  <div class="form-card">
    <h2>🕌 New Donation Entry</h2>
    <div class="two-col">
      <div class="form-row"><label>Receipt No.</label><input type="text" id="f_no" placeholder="D-001"/></div>
      <div class="form-row"><label>Date</label><input type="date" id="f_date"/></div>
    </div>
    <div class="form-row"><label>Donor Name / જનાબ</label><input type="text" id="f_name" placeholder="Full name" autocomplete="off"/></div>
    <div class="form-row"><label>Address / સરનામું</label><textarea id="f_address" rows="2" placeholder="Village, City, State..."></textarea></div>
    <div class="form-row"><label>Phone (optional)</label><input type="tel" id="f_phone" placeholder="+91 XXXXX XXXXX"/></div>
    <div class="form-row">
      <label>Donation Type / કયા ખાતે</label>
      <div class="dtype-grid">
        <div><input class="dtype-option" type="radio" name="dtype" id="dt_z" value="ZAKAT" checked><label class="dtype-label" for="dt_z">ZAKAT<span class="guj">ઝકાત</span></label></div>
        <div><input class="dtype-option" type="radio" name="dtype" id="dt_s" value="SADQA"><label class="dtype-label" for="dt_s">SADQA<span class="guj">સદકા</span></label></div>
        <div><input class="dtype-option" type="radio" name="dtype" id="dt_l" value="LILLAH"><label class="dtype-label" for="dt_l">LILLAH<span class="guj">લીલ્લાહ</span></label></div>
        <div><input class="dtype-option" type="radio" name="dtype" id="dt_i" value="IS.SAWAB"><label class="dtype-label" for="dt_i">IS.SAWAB<span class="guj">ઈ.સવાબ</span></label></div>
        <div><input class="dtype-option" type="radio" name="dtype" id="dt_m" value="IMDAD"><label class="dtype-label" for="dt_m">IMDAD<span class="guj">ઈમદાદ</span></label></div>
        <div><input class="dtype-option" type="radio" name="dtype" id="dt_o" value="OTHER"><label class="dtype-label" for="dt_o">OTHER<span class="guj">અન્ય</span></label></div>
      </div>
    </div>
    <div class="form-row"><label>Amount (₹)</label><input type="number" id="f_amount" placeholder="0" min="0" inputmode="numeric"/></div>
    <div class="form-row"><label>Amount in Words (auto)</label><input type="text" id="f_words" readonly style="background:#f0f0f0;font-size:13px"/></div>
    <div class="form-row">
      <label>📍 Stamp (upload from gallery)</label>
      <div class="stamp-upload-area" onclick="document.getElementById('stampInput').click()">
        <div id="stampUploadText">📂 Tap to upload stamp image</div>
        <img id="stampPreview" class="stamp-preview" style="display:none"/>
        <br><button class="stamp-clear" id="stampClearBtn" style="display:none" onclick="clearStamp(event)">✕ Remove</button>
      </div>
      <input type="file" id="stampInput" accept="image/*" style="display:none" onchange="handleStamp(this)">
    </div>
    <button class="btn-generate" onclick="generateReceipt()">Generate Receipt 🧾</button>
  </div>
</div>

<!-- RECEIPT -->
<div id="receiptTab" class="tab-panel">
  <div id="receiptArea">
    <div class="receipt-actions">
      <button class="btn-back" onclick="showTab('formTab',document.querySelectorAll('.tab-btn')[0])">← Back</button>
      <button class="btn-print" onclick="window.print()">🖨️ Print/PDF</button>
      <button class="btn-wa" onclick="shareWhatsApp()">📤 WhatsApp</button>
      <button class="btn-new" onclick="newReceipt()">+ New</button>
    </div>
    <div class="receipt-body" id="receiptBody"></div>
  </div>
</div>

<!-- RECORDS -->
<div id="recordsTab" class="tab-panel">
  <div id="recordsArea">
    <div class="records-hdr">
      <h2>📊 Donation Records</h2>
      <div style="display:flex;gap:6px">
        <button class="btn-export" onclick="exportCSV()">⬇️ CSV</button>
        <button class="btn-clr" onclick="clearAll()">🗑️ Clear</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>No.</th><th>Date</th><th>Name</th><th>Address</th><th>Phone</th><th>Type</th><th>₹ Amount</th></tr></thead>
        <tbody id="recordsBody"></tbody>
      </table>
    </div>
    <div id="totalBar" class="total-bar" style="display:none"><span>Total Donations</span><span id="totalAmt"></span></div>
  </div>
</div>

<div id="toast"></div>

let stampDataURL=null;
function handleStamp(input){
  if(!input.files||!input.files[0])return;
  const reader=new FileReader();
  reader.onload=e=>{stampDataURL=e.target.result;document.getElementById('stampPreview').src=stampDataURL;document.getElementById('stampPreview').style.display='block';document.getElementById('stampUploadText').textContent='✅ Stamp loaded';document.getElementById('stampClearBtn').style.display='inline-block';};
  reader.readAsDataURL(input.files[0]);
}
function clearStamp(e){e.stopPropagation();stampDataURL=null;document.getElementById('stampPreview').style.display='none';document.getElementById('stampPreview').src='';document.getElementById('stampUploadText').textContent='📂 Tap to upload stamp image';document.getElementById('stampClearBtn').style.display='none';document.getElementById('stampInput').value='';}

document.getElementById('f_amount').addEventListener('input',function(){const v=parseFloat(this.value)||0;document.getElementById('f_words').value=v?numberToWords(v)+' Only':'';});
function numberToWords(n){
  if(n===0)return'Zero Rupees';
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function b100(n){return n<20?ones[n]:tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');}
  function b1000(n){return n<100?b100(n):ones[Math.floor(n/100)]+' Hundred'+(n%100?' '+b100(n%100):'');}
  let r='',x=Math.floor(n);
  const cr=Math.floor(x/10000000);x%=10000000;
  const lk=Math.floor(x/100000);x%=100000;
  const th=Math.floor(x/1000);x%=1000;
  if(cr)r+=b1000(cr)+' Crore ';if(lk)r+=b1000(lk)+' Lakh ';if(th)r+=b1000(th)+' Thousand ';if(x)r+=b1000(x);
  return'Rupees '+r.trim();
}

function showTab(id,btn){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(btn)btn.classList.add('active');
  if(id==='recordsTab')renderRecords();
}

function generateReceipt(){
  const no=document.getElementById('f_no').value.trim()||getNextNo();
  const dateVal=document.getElementById('f_date').value;
  const name=document.getElementById('f_name').value.trim();
  const address=document.getElementById('f_address').value.trim();
  const phone=document.getElementById('f_phone').value.trim();
  const amount=parseFloat(document.getElementById('f_amount').value)||0;
  const words=document.getElementById('f_words').value||(amount?numberToWords(amount)+' Only':'');
  const dtype=document.querySelector('input[name="dtype"]:checked').value;
  if(!name){alert('Please enter donor name.');return;}
  if(!amount){alert('Please enter donation amount.');return;}
  const d=dateVal?new Date(dateVal+'T00:00:00'):new Date();
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const yy=String(d.getFullYear()).slice(2);

  document.getElementById('receiptBody').innerHTML=
    '<div class="r-header">'+
      '<div class="r-header-top">'+
        '<img class="r-logo" src="'+LOGO_B64+'" alt="Logo"/>'+
        '<div class="r-header-center">'+
          '<div class="r-arabic-top">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم | اَلْمَدَنِي بَرَكَاتِي شُوشِيَل وِيلْفِيَر ٹَرَسٹ</div>'+
          '<div class="r-org">Al Madni-Barkati Social-Welfare Trust</div>'+
          '<div class="r-sub">Under Taking : JAMIATUL BANAT JAMIA FATIMATUZ-ZAHRA</div>'+
          '<div class="r-addr">Noor-e-Ilahi Society, Near Napa Tol, At-Po.: Napa, Talapad, Ta : Borsad, Dist : Anand, Gujarat (INDIA) 388560</div>'+
        '</div>'+
        '<img class="r-logo" src="'+LOGO_B64+'" alt="Logo"/>'+
      '</div>'+
    '</div>'+
    '<div class="r-guj-band">'+
      'અલ-મદની-બરકાતી સોશ્યલ વેલ્ફેર ટ્રસ્ટ સંચાલિત જામીઅતુલ બનાત જામીઆ ફાતિમતુઝ ઝહરા<br>'+
      'નૂરે ઇલાહી સોસાયટી, નાપા ટોલ પાસે, મુ.નાપા-તળપદ, તા. બોરસદ, જિ.આણંદ (ગુજરાત) Mo. 9724997906, 9099945092'+
    '</div>'+
    '<div class="r-fields">'+
      '<div class="r-row-top">'+
        '<div class="r-no">No. D &nbsp;<span>'+no.replace('D-','')+'</span></div>'+
        '<div class="r-treg">Trust Reg. No. E-2922/Anand</div>'+

function shareWhatsApp(){
  const el=document.getElementById('receiptBody');
  showToast('📸 Preparing image...');
  html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#fffef0'}).then(canvas=>{
    canvas.toBlob(blob=>{
      if(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File([blob],'receipt.png',{type:'image/png'})]})){
        const file=new File([blob],'Al-Madni-Receipt.png',{type:'image/png'});
        navigator.share({title:'Donation Receipt',text:'Al Madni-Barkati Donation Receipt',files:[file]}).catch(()=>fallbackWA(canvas));
      }else{fallbackWA(canvas);}
    },'image/png');
  }).catch(()=>showToast('❌ Could not generate image'));
}
function fallbackWA(canvas){
  const link=document.createElement('a');link.download='Al-Madni-Receipt.png';link.href=canvas.toDataURL('image/png');link.click();
  setTimeout(()=>{window.open('https://wa.me/','_blank');},800);
  showToast('📥 Image saved! Opening WhatsApp...');
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}

function getRecords(){try{return JSON.parse(localStorage.getItem('almadni_v2')||'[]');}catch(e){return[];}}
function saveRecord(r){const recs=getRecords();recs.push(r);localStorage.setItem('almadni_v2',JSON.stringify(recs));}
function getNextNo(){
  const recs=getRecords();if(!recs.length)return'D-001';
  const last=recs[recs.length-1].no||'D-000';const num=parseInt(last.replace(/\D/g,''))||0;
  return'D-'+String(num+1).padStart(3,'0');
}
function renderRecords(){
  const recs=getRecords(),tb=document.getElementById('recordsBody');
  if(!recs.length){tb.innerHTML='<tr><td colspan="8" class="no-rec">No records yet 🕌</td></tr>';document.getElementById('totalBar').style.display='none';return;}
  let total=0;
  tb.innerHTML=recs.map((r,i)=>{total+=parseFloat(r.amount)||0;return'<tr><td>'+(i+1)+'</td><td><b>'+r.no+'</b></td><td>'+(r.date||'-')+'</td><td>'+r.name+'</td><td>'+(r.address||'-')+'</td><td>'+(r.phone||'-')+'</td><td><span class="badge">'+r.dtype+'</span></td><td><b>₹'+parseFloat(r.amount).toLocaleString('en-IN',{minimumFractionDigits:2})+'</b></td></tr>';}).join('');
  document.getElementById('totalBar').style.display='flex';
  document.getElementById('totalAmt').textContent='₹'+total.toLocaleString('en-IN',{minimumFractionDigits:2});
}
function exportCSV(){
  const recs=getRecords();if(!recs.length){alert('No records to export.');return;}
  const h=['Sr.','Receipt No.','Date','Name','Address','Phone','Type','Amount (INR)'];
  const rows=recs.map((r,i)=>[i+1,r.no,r.date,r.name,r.address,r.phone,r.dtype,r.amount]);
  const csv=[h,...rows].map(r=>r.map(c=>'"'+(c||'')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='AlMadni_Donations_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
function clearAll(){if(confirm('Delete ALL records? Cannot be undone!')){localStorage.removeItem('almadni_v2');renderRecords();}}
function newReceipt(){
  document.getElementById('f_name').value='';document.getElementById('f_address').value='';
  document.getElementById('f_phone').value='';document.getElementById('f_amount').value='';
  document.getElementById('f_words').value='';document.getElementById('f_no').value=getNextNo();
  document.getElementById('f_date').valueAsDate=new Date();
  document.querySelector('input[name="dtype"]').checked=true;
  clearStamp({stopPropagation:()=>{}});
  document.getElementById('receiptTabBtn').style.display='none';
  showTab('formTab',document.querySelectorAll('.tab-btn')[0]);
}
</script>
